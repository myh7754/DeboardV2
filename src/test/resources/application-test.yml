spring:
  sql:
    init:
      mode: always
      data-locations: classpath:test-init.sql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/deboard_test?rewriteBatchedStatements=true&createDatabaseIfNotExist=true
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:ci-test}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile
          kakao:
            client-name: Kakao
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
          naver:
            client-name: Naver
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            user-name-attribute: id
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            user-name-attribute: response
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cookie:
    secure: false

rss:
  schedule:
    cron: "0 0 3 * * *"

custom:
  jwt:
    validation:
      access: 30m
      refresh: 1h
    secret:
      app-key: test-only-app-key-not-a-real-secret-000000000000000000000000
      origin-key: test-only-origin-key-not-a-real-secret-00000000000000000000
  front:
    redirect-url: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: "health"

logging:
  level:
    root: WARN
    org.example.deboardv2: INFO
